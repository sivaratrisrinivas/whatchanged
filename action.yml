name: whatchanged
description: Report surface and wire changes between two elevenlabs SDK versions and comment on the PR
inputs:
  from:
    description: Older elevenlabs version
    required: true
  to:
    description: Newer elevenlabs version
    required: true
  guide:
    description: Optional upgrade guide to check against (for example v3)
    required: false
    default: ""
  comment:
    description: Post the report as a PR comment ("true" or "false")
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment
    required: false
    default: ${{ github.token }}
outputs:
  report:
    description: Path to the generated Markdown report
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install whatchanged
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Generate report
      id: run
      shell: bash
      env:
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
        GUIDE: ${{ inputs.guide }}
      run: |
        out="$RUNNER_TEMP/whatchanged.md"
        args=("$FROM" "$TO" -o "$out" --cache "$RUNNER_TEMP/whatchanged-cache")
        if [ -n "$GUIDE" ]; then args+=(--guide "$GUIDE"); fi
        whatchanged "${args[@]}"
        echo "report=$out" >> "$GITHUB_OUTPUT"
        cat "$out" >> "$GITHUB_STEP_SUMMARY"
    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        REPORT: ${{ steps.run.outputs.report }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- whatchanged -->';
          let body = fs.readFileSync(process.env.REPORT, 'utf8');
          const limit = 60000; // GitHub comments max out at 65536 characters
          if (body.length > limit) {
            body = body.slice(0, limit) + '\n\n_Report truncated; see the job summary for the full text._\n';
          }
          body = marker + '\n' + body;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
